[package]
name = "helpspotrs"
version = "1.0.0"
edition = "2021"
description = "HelpSpot REST API Client Library"
authors = ["HelpSpot"]
license = "MIT"

[[bin]]
name = "helpspot"
path = "src/main.rs"

[lib]
name = "helpspotrs"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
base64 = "0.22"
tabled = "0.16"

[profile.release]
strip = true
lto = true
codegen-units = 1
